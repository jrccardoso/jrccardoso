name: generate snake animation

on:
  schedule:
    - cron: "0 20 * * *"   # diário às 20:00 UTC
  workflow_dispatch:        # permite correr manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # PAT com scope read:user -> permite captar contribuicoes privadas
          # (visiveis) alem das publicas. Fallback para GITHUB_TOKEN se nao existir.
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
